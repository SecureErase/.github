name: Add issue to CFK-SE Work Tracker

on:
  workflow_call:
    secrets:
      CFKSE_PROJECT_TOKEN:
        required: true

permissions:
  contents: read
  issues: read

jobs:
  add-to-project:
    if: github.event.issue != null && github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to personal project
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/isaiah-clark/projects/1
          github-token: ${{ secrets.CFKSE_PROJECT_TOKEN }}
