name: CFK-SE Project Tracking

on:
  issues:
    types: [opened, reopened, transferred]

permissions:
  contents: read
  issues: read

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to CFK-SE Work Tracker
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/users/isaiah-clark/projects/1
          github-token: ${{ secrets.CFKSE_PROJECT_TOKEN }}